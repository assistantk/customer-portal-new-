# Internal CRIS relay configuration
# Allow toggling authentication via env CRIS_SMTP_AUTH (default true)
 spring.mail.properties.mail.smtp.auth=${CRIS_SMTP_AUTH:true}

# Explicit connection and socket timeouts to prevent indefinite hanging (5-7 seconds)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=7000
spring.mail.properties.mail.smtp.writetimeout=5000

# Enable JavaMail debug logging to inspect SMTP conversation on submit
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}

# Error response hardening - never leak stack traces or internal exception details
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Set to false unless CRIS confirms TLS/SSL is required - internal relays commonly don't use it
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=false

# ─────────────────────────────────────────────────────────
# RMS Office API Configuration
# ─────────────────────────────────────────────────────────
rms.api.base-url=${RMS_API_BASE_URL:http://10.60.201.192:7101/RMS}
# ATVLDTUSER uses the configured RMS base URL and appends /ATVLDTUSER.
rms.api.otp-base-url=${RMS_OTP_API_BASE_URL:http://10.60.201.192:7101/RMS}
rms.api.validate-user-path=/ATVLDTUSER
rms.api.logout-path=${RMS_LOGOUT_PATH:/ATUSERLGOT}
rms.api.generate-otp-path=/RTGNRTOTP
rms.api.verify-otp-path=/RTVRFYOTP
# Configured client identifier sent as F_CLNTID
rms.api.client-id=${RMS_CLIENT_ID:1.1.1.1}
# Project identifier sent as F_CNSR in OTP generation request
rms.api.project-name=${RMS_PROJECT_NAME:FreightCodeGenerator}
# HTTP client timeouts for RMS API calls (milliseconds)
rms.api.connect-timeout-ms=${RMS_CONNECT_TIMEOUT:5000}
rms.api.read-timeout-ms=${RMS_READ_TIMEOUT:10000}
# OTP resend cooldown is fixed at one minute and enforced by the backend.

# Login credentials must arrive over HTTPS. Configure TLS at the WebLogic listener
# or trusted TLS-terminating proxy; local HTTP development may explicitly override.
app.security.require-https=${REQUIRE_HTTPS:true}

# ──────────────────────────────────────────────────────────────────
# Logging Configuration
# ──────────────────────────────────────────────────────────────────

# Keep console and file logging output in UTF-8.
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# Log directory — overridable with LOG_PATH environment variable or logging.file.path system property.
logging.file.path=${LOG_PATH:/switch/Application_Logs/FreightCodeLog}
logging.class-file.max-size=${CLASS_LOG_MAX_SIZE:20MB}
logging.class-file.max-history=${CLASS_LOG_MAX_HISTORY:30}
logging.class-file.total-size-cap=${CLASS_LOG_TOTAL_SIZE_CAP:1GB}
logging.class-file.max-open-files=${CLASS_LOG_MAX_OPEN_FILES:100}
logging.class-file.timeout=${CLASS_LOG_TIMEOUT:30 minutes}

# Do NOT use spring.jpa.show-sql — it bypasses SLF4J and writes to stdout directly.
# All SQL logging is controlled by the Hibernate loggers in logback-spring.xml.

# ── Hibernate 5 (Spring Boot 2.7.x ships Hibernate 5.6.x) ────────
# SQL statement logging is configured by the active Logback profile; bind values are never logged.
# Hibernate bind parameters are intentionally not logged because they can contain sensitive data.

# ─────────────────────────────────────────────────────────
# Tesseract OCR Configuration
# ─────────────────────────────────────────────────────────
tesseract.executable-path=${TESSERACT_PATH:tesseract}
tesseract.tessdata-path=${TESSDATA_PREFIX:}

