# ==============================================================================
# CRIS Customer Registration Portal — Nginx Reverse Proxy Configuration
#
# Primary Domain: customer-portal.example.org (Placeholder)
# Frontend Static Root: /var/www/customer-portal
# Backend API Upstream: http://127.0.0.1:8080
# ==============================================================================

upstream backend_portal {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# HTTP Server Block (Port 80)
# Use this block initially before SSL/TLS certificates are installed.
# Once TLS certificates are available, uncomment the redirect inside this block
# and activate the HTTPS block below.
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name customer-portal.example.org;

    # Access and Error Logs
    access_log /var/log/nginx/customer-portal_access.log combined;
    error_log /var/log/nginx/customer-portal_error.log warn;

    # Document upload limit (Spring Boot multipart limit is 5MB)
    client_max_body_size 15M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # React Frontend Static Assets
    root /var/www/customer-portal;
    index index.html;

    # React Client-Side SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching (Vite bundles with content hashes)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Spring Boot Backend API Proxy
    # Frontend calls '/api/customers/...' and expects the '/api' prefix preserved
    location /api/ {
        proxy_pass http://backend_portal;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts for database queries and document processing
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings for uploads
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Prevent direct access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # HTTPS REDIRECT (Uncomment when SSL/TLS certificate is configured)
    # --------------------------------------------------------------------------
    # return 301 https://$host$request_uri;
}

