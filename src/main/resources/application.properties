# Internal CRIS relay configuration
# Allow toggling authentication via env CRIS_SMTP_AUTH (default true)
 spring.mail.properties.mail.smtp.auth=${CRIS_SMTP_AUTH:true}

# Explicit connection and socket timeouts to prevent indefinite hanging (5-7 seconds)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=7000
spring.mail.properties.mail.smtp.writetimeout=5000

# Enable JavaMail debug logging to inspect SMTP conversation on submit
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}

# Error response hardening - never leak stack traces or internal exception details
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Set to false unless CRIS confirms TLS/SSL is required - internal relays commonly don't use it
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=false

# ─────────────────────────────────────────────────────────
# RMS Office API Configuration
# AUTH_MODE=live  → call real RMS office APIs (default in production)
# AUTH_MODE=mock  → explicitly development-only local testing (never fallback)
# ─────────────────────────────────────────────────────────
rms.auth.mode=${AUTH_MODE:live}
rms.api.base-url=${RMS_API_BASE_URL:}
rms.api.validate-user-path=/ATVLDTUSER
rms.api.generate-otp-path=/RTGNRTOTP
rms.api.verify-otp-path=/RTVRFYOTP
# Configured client identifier sent as F_CLNTID
rms.api.client-id=${RMS_CLIENT_ID:1.1.1.1}
# Project identifier sent as F_CNSR in OTP generation request
rms.api.project-name=${RMS_PROJECT_NAME:FreightCodeGenerator}
# HTTP client timeouts for RMS API calls (milliseconds)
rms.api.connect-timeout-ms=${RMS_CONNECT_TIMEOUT:5000}
rms.api.read-timeout-ms=${RMS_READ_TIMEOUT:10000}
# OTP resend cooldown in seconds (1 minute / 60 seconds)
rms.api.otp-resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}

# Login credentials must arrive over HTTPS. Configure TLS at the WebLogic listener
# or trusted TLS-terminating proxy; local HTTP development may explicitly override.
app.security.require-https=${REQUIRE_HTTPS:true}

# Authentication toggle: false removes login requirement so portal can be used directly without a login screen
app.auth.enabled=${AUTH_ENABLED:true}
