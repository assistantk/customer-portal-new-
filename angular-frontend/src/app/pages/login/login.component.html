<div class="login-app">
  <!-- Header — same style as registration -->
  <header class="login-header">
    <div class="login-brand">
      <div class="login-cris">
        <img src="assets/cris-logo.png" alt="CRIS" />
      </div>
    </div>

    <span class="login-title">Login Page</span>

    <div class="login-cris">
      <img src="assets/cris-logo.png" alt="CRIS" />
    </div>
  </header>

  <!-- Main -->
  <main class="login-main">
    <div class="login-card">
      <!-- Card head — matches registration card-head -->
      <div class="login-card-head">
        <div class="login-railways-banner">
          <img src="assets/indian-railways-logo.png" alt="Indian Railways" />
        </div>
      </div>

      <div class="login-rule"></div>

      <!-- Error banner -->
      <div *ngIf="error" class="login-error-banner">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <span>{{ error }}</span>
      </div>

      <!-- Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-grid" autocomplete="off">
        <!-- User ID or email -->
        <div class="login-field-wrap">
          <label for="login-user">User ID or Email <b>*</b></label>
          <div class="login-control">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <input id="login-user" type="text" placeholder="Enter User ID or email address" formControlName="userId"
              autofocus />
          </div>
        </div>

        <!-- Password -->
        <div class="login-field-wrap">
          <label for="login-pass">Password <b>*</b></label>
          <div class="login-control">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input id="login-pass" [type]="showPassword ? 'text' : 'password'" placeholder="Enter Password"
              formControlName="password" />
            <button type="button" class="login-pw-toggle" (click)="togglePassword()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              <svg *ngIf="showPassword" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"
                viewBox="0 0 24 24">
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
              <svg *ngIf="!showPassword" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"
                viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Captcha -->
        <div class="login-field-wrap">
          <label for="login-captcha">Enter Captcha <b>*</b></label>
          <div class="login-control">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
              <polyline points="9 12 11 14 15 10" />
            </svg>
            <input id="login-captcha" type="text" placeholder="Enter Captcha" formControlName="captchaInput"
              autocomplete="off" />
          </div>
        </div>

        <!-- Captcha display -->
        <div class="login-captcha-row">
          <canvas #captchaCanvas width="150" height="40" class="login-captcha-canvas"></canvas>
          <button type="button" class="login-captcha-refresh" (click)="refreshCaptcha()" aria-label="Refresh captcha">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
            </svg>
          </button>
        </div>

        <!-- Actions — same style as registration -->
        <div class="login-actions">
          <div class="login-secure">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
              <polyline points="9 12 11 14 15 10" />
            </svg>
            <span>Secure encrypted login</span>
          </div>
          <div class="login-btns">
            <button type="submit" class="login-submit" [disabled]="loading">
              <svg *ngIf="loading" width="14" height="14" class="spin" fill="none" stroke="currentColor"
                stroke-width="2" viewBox="0 0 24 24">
                <path d="M21 12a9 9 0 1 1-6.219-8.56" />
              </svg>
              <svg *ngIf="!loading" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                viewBox="0 0 24 24">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                <polyline points="10 17 15 12 10 7" />
                <line x1="15" y1="12" x2="3" y2="12" />
              </svg>
              {{ loading ? 'Signing in…' : 'Login' }}
            </button>
            <button type="button" class="login-reset" (click)="handleReset()" [disabled]="loading">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
              </svg>
              Reset
            </button>
          </div>
        </div>
      </form>
    </div>
  </main>

  <!-- Footer — same as registration -->
  <footer class="login-footer">
    Designed and Developed By <strong>CENTRE FOR RAILWAY INFORMATION SYSTEMS</strong> Chanakyapuri, New Delhi-110021
  </footer>
</div>
