<div class="toast-container" aria-live="polite" aria-atomic="true">
  <div
    *ngFor="let n of notifications; trackBy: trackById"
    class="toast-item toast-{{ n.type }}"
    [attr.role]="n.type === 'error' ? 'alert' : 'status'"
  >
    <div class="toast-icon">
      <!-- Success Icon -->
      <svg *ngIf="n.type === 'success'" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
        <polyline points="22 4 12 14.01 9 11.01" />
      </svg>
      <!-- Error Icon -->
      <svg *ngIf="n.type === 'error'" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10" />
        <line x1="15" y1="9" x2="9" y2="15" />
        <line x1="9" y1="9" x2="15" y2="15" />
      </svg>
      <!-- Warning Icon -->
      <svg *ngIf="n.type === 'warning'" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
        <line x1="12" y1="9" x2="12" y2="13" />
        <line x1="12" y1="17" x2="12.01" y2="17" />
      </svg>
      <!-- Info Icon -->
      <svg *ngIf="n.type === 'info'" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="16" x2="12" y2="12" />
        <line x1="12" y1="8" x2="12.01" y2="8" />
      </svg>
    </div>

    <div class="toast-body">
      <strong class="toast-title">{{ n.title }}</strong>
      <p class="toast-message">{{ n.message }}</p>
    </div>

    <button
      type="button"
      class="toast-close"
      (click)="dismiss(n.id)"
      aria-label="Dismiss notification"
      title="Dismiss"
    >
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>
  </div>
</div>
